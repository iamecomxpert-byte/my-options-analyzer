name: Monitor Options Portfolio

on:
  schedule:
    # Run every 30 minutes during US trading hours (9:30 AM - 4:00 PM ET)
    # ET = UTC-5, so 14:30 UTC = 9:30 ET, 21:00 UTC = 16:00 ET
    # Monday-Friday only (1-5)
    - cron: '*/30 14-21 * * 1-5'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scipy gspread google-auth
      
      - name: Run portfolio monitor
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python portfolio_monitor.py
